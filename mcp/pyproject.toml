[project]
name = "openagile-mcp"
version = "1.0.0"
description = "OpenAgile MCP harness — authoritative event-sourced Kanban backend (Python port of the Node harness)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=1.9.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7",
]

[project.scripts]
agile-mcp = "agile_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agile_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/agile_mcp", "tests", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
